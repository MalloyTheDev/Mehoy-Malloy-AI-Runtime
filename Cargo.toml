[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
license = "MIT OR Apache-2.0"
repository = "https://github.com/MalloyTheDev/Mehoy-Malloy-AI-Runtime"
authors = ["MalloyTheDev"]

[workspace.dependencies]
mehoy-core = { path = "crates/mehoy-core", version = "0.1.0" }
mehoy-protocol = { path = "crates/mehoy-protocol", version = "0.1.0" }
mehoy-daemon = { path = "crates/mehoy-daemon", version = "0.1.0" }

http-body-util = "0.1.5"
hyper = "1.11"
hyper-util = "0.1.20"
libc = "0.2"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
tokio = "1.53"
windows-sys = "0.61"

[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "deny"

[workspace.lints.clippy]
all = { level = "deny", priority = -1 }

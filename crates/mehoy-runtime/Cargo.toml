[package]
name = "mehoy-runtime"
description = "Joins registered artifacts to execution backends and owns live model instances."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[features]
# Test-only. Allows a failure to be injected after a backend has become ready, so
# the rollback path can actually be exercised rather than assumed.
fault-injection = []

# Opt-in. Builds the test targets that need a real backend executable and a
# multi-gigabyte model on disk. Excluded from the default gate because they are
# not portable, not deterministic, and slow: what they verify is the behaviour of
# a particular engine build rather than of this code.
real-backend-tests = []

[dependencies]
mehoy-backend-llama = { path = "../mehoy-backend-llama", version = "0.1.0" }
mehoy-core.workspace = true
mehoy-registry = { path = "../mehoy-registry", version = "0.1.0" }

getrandom = "0.4"

tokio = { workspace = true, features = ["macros", "rt", "time"] }

[dev-dependencies]
# The runtime's own fault, and the core fault that makes a refused kill
# reachable so a failed teardown can be exercised rather than argued about.
mehoy-core = { workspace = true, features = ["fault-injection"] }
mehoy-runtime = { path = ".", features = ["fault-injection"] }
tempfile = "3"
tokio = { workspace = true, features = ["rt-multi-thread", "sync"] }

[[test]]
name = "model_classes"
required-features = ["real-backend-tests"]

[[test]]
name = "cancellation"
required-features = ["real-backend-tests"]

[[test]]
name = "unload"
required-features = ["real-backend-tests"]

[[test]]
name = "ownership"
required-features = ["real-backend-tests"]

# The accounting policy is unit-tested in the library and runs on every commit.
# This target covers only what joining it to a real load establishes, so it needs
# a model to load.
[[test]]
name = "accounting"
required-features = ["real-backend-tests"]

[lints]
workspace = true

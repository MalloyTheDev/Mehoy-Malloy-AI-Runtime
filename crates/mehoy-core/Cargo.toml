[package]
name = "mehoy-core"
description = "Shared runtime types and the local endpoint transport for the Mehoy runtime."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[features]
# Test-only. Inserts scheduling yields at endpoint handoff boundaries to widen
# race windows. Never enable this in a release build; it exists so that timing
# defects surface in tests instead of in production.
race-amplifier = []

[dependencies]
tokio = { workspace = true, features = ["io-util", "macros", "net", "process", "rt", "sync", "time"] }

[target.'cfg(unix)'.dependencies]
libc.workspace = true

[target.'cfg(windows)'.dependencies]
windows-sys = { workspace = true, features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_Security_Authorization",
    "Win32_System_JobObjects",
    "Win32_System_Threading",
] }

[dev-dependencies]
tokio = { workspace = true, features = ["rt-multi-thread", "macros"] }

[[example]]
name = "dummy_worker"

[[example]]
name = "orphan_parent"

[lints]
workspace = true

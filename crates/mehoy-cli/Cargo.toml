[package]
name = "mehoy-cli"
description = "The Mehoy command-line client."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[lib]
name = "mehoy_cli"
path = "src/lib.rs"

[[bin]]
name = "mehoy"
path = "src/main.rs"

[dependencies]
mehoy-core.workspace = true
mehoy-protocol.workspace = true

http-body-util.workspace = true
hyper = { workspace = true, features = ["client", "http1"] }
hyper-util = { workspace = true, features = ["tokio"] }
serde.workspace = true
serde_json.workspace = true
tokio = { workspace = true, features = ["macros", "net", "rt-multi-thread", "time"] }

[dev-dependencies]
mehoy-daemon.workspace = true
# Integration tests run the transport with race amplification enabled. A plain
# `cargo build` does not build dev-dependencies, so this stays out of binaries.
mehoy-core = { workspace = true, features = ["race-amplifier"] }

[lints]
workspace = true
